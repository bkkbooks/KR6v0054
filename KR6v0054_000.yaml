front:
  text: 如來在金棺囑纍清淨莊嚴敬福經整理者侯旭東題解如來在金棺囑纍清淨莊嚴敬福經又名敬福經佛說敬福經金棺敬福經佛在金棺敬福經如來在金棺囑類清淨敬福經中國僧人所撰著者不詳一卷該經以釋迦牟尼涅槃前坐在金棺上回答須菩提提問的形式闡述現世僧俗寫經造像所應遵循的原則如匠手寫典刊容須遵從的儀軌戒律寫經造像能否收取錢財寫經造像中的布施問題抄經訛誤造像相好不具的後果等等該經折射出當時世間福業中存在的種種弊病亦反映了僧伽糾弊的努力該經編成的具體年代尚難確定依現有資料它大約形成於南北朝末至唐初的百餘年間初成於南北朝末葉當時經題作佛在金棺上囑纍經以下簡稱囑纍經篇幅約為敬福經之半至晚在唐初七世紀上半葉形成現在的形態該經不見於出三藏記集自隋法經録以後諸經録多豫收録置於疑僞經類中我國歷代大藏經未曾收入該經日本大正藏第卷據敦煌遺書號殘卷收録據現有資料推斷囑纍經乃是敬福經的前身或雛形故將兩經分別整理囑纍經無寫本傳世僅隋開皇九年公元年山東汶上縣辛家海村之章仇禹生造經像碑上刻有此經碑上所刻蓋是該經全文該碑拓本現存北京圖書館善本部編號顧影印拓本收入北京圖書館藏中國歷代石刻拓本彙編第六冊第頁又見敦煌學輯刊年第期的封三録文分見魯迅輯校石刻手稿第二函第五冊第頁及李靜傑佛教造像碑第頁該拓本中間有殘損敬福經現存三種本子一陝西省麟游縣慈善寺石窟第二窟主佛南側下距地面近米處刻有該經刻經年代據研究與第二窟開鑿年代基本一致為唐高宗中晚期至武周時期該刻録文發表在考古年第期第頁此本內容基本完整但字跡漫漶不清處頗多二敦煌遺書號文書影印本見敦煌寶藏第二冊第頁即為大正藏第卷所收底本此本僅存經首百餘字三北京房山雲居寺第九洞刻經本拓本編號此經為唐開成四年公元年四月八日幽州石䃥下石經邑人及諸多施主所造此本接近經尾處文字有脫落這次整理底校本情況如下囑纍經底本隋開皇九年碑刻本無校本囑纍經無校本相關處必要時以敬福經互校為便於閲讀殘損處酌情据敬福經補入具體情況隨文說明敬福經底本房山石經本校本甲本陝西麟游慈善寺石刻本乙本敦煌遺書號為避文繁甲本漫漶處不另出注另諸經要集法苑珠林等書中曾引用過該經亦有可資補充校勘處具體情況隨文說明中國社會科學院考古所常青先生提供陝西麟游慈善寺刻經的拓本整理過程中方廣錩先生多方幫助謹此致謝録文一
