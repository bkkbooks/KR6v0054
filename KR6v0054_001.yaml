body:
  text: 如是我聞一時佛在拘尸那城裟羅雙樹間說涅槃訖竟垂入金棺欲焚其身偏坐金棺楯上雙目出淚無量大菩薩衆天龍八部等悉皆生疑解衆仰請決疑不審聽不佛言任說須菩提言世尊如來恆說涅槃常樂永無生死何由今坐金棺楯上涕淚交流令衆疑也佛言須菩提吾今欲說汝已請問吾亦不為涅槃生苦而懷泣耶汝等諦聽善思念之吾今為說我去世後當來末劫之時比丘比丘尼優婆塞優婆夷善男子等所造經像悉不如法是故愍之須菩提言世尊何者是法何者非法佛言若未來世四衆善男子等所造經像望顏逐意濫取匠手雖造經像極多獲福甚少若有精誠所造雖少獲福甚多須菩提言世尊何故造多福少造少福多佛言善男子造經像法嚴持淨室香湯灑地懸繒幡蓋經像之師別作淨衣大小便利澡浴入室燒香禮拜然後捉筆捉鑿之具寫典刊容是法酒肉五辛永乖勿妻室之宮亦莫近之歲三月六不得有闕如是經像之師真是大士合消供養經像主莫論道雇經像之匠莫云客作造訖布施二人獲福不可度量欲說其福窮劫不盡受吾約制是佛真子須菩提白佛言世尊比丘之中作經像師合取直不佛言不得取價直賣父母取財逆過三千真是天魔急離吾佛法非我眷屬善男子安經案處安像處方圓百由旬諸天擎華香四廂供養肉眼不見若造經像精誠敬心經至一偈像如拇指其福最大佛不妄語善男子等若欲造經像先誦此典然後營造得福無量善男子當來末劫五濁惡世四衆善男子善女人等所造經像直欲解願所有匠手覓財不取上勝賢善之人直取不識法相者以為師匠飲酒食肉五辛之徒不依聖教雖造經如微塵數造像如微塵數其福甚少蓋不足言劫燒之時不入海龍王藏勞如功少不敬之坐死入地獄主匠二人無益諸天不皊不如不造直心禮拜得福無量善男子經主像主悉是過去人士但由耽著惡識不記宿命吾今欲說永劫不盡入涅槃時至不得久居略說遺言大衆流通莫生懈怠說此經說已金棺忽開火起焚影菩薩大衆悲號咽絶於即如來聲止滅去大地傾動衆生失蔭大衆奉行録文完
